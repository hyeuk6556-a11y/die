<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기부천사 펀치 아레나</title>
<style>
:root{color-scheme:dark;--y:#f7d54a;--ink:#131328}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#34365e,#121321 70%);font-family:system-ui,'Malgun Gothic',sans-serif;color:white;min-height:100svh;display:grid;place-items:center;padding:15px;user-select:none}.shell{width:min(890px,100%);border:3px solid #fff3;border-radius:25px;overflow:hidden;background:#1d1f37;box-shadow:0 20px 70px #0009}.top{padding:19px 22px 12px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:clamp(21px,4vw,32px);font-weight:1000;letter-spacing:-1px}.tag{color:#171724;background:var(--y);font-weight:900;padding:5px 10px;border-radius:8px;transform:rotate(-3deg);display:inline-block;font-size:12px}.stats{display:flex;gap:16px}.stat{min-width:83px;text-align:center}.stat small{display:block;color:#aeb0c8;font-size:11px;font-weight:800;letter-spacing:1px}.stat b{font-size:23px;font-variant-numeric:tabular-nums}.health{margin:0 22px 14px;background:#0e1121;height:18px;border:2px solid #ffffff42;border-radius:12px;overflow:hidden}.health>div{height:100%;width:100%;background:linear-gradient(90deg,#ff585f,#ffa849);transition:width .2s}.stage{height:min(470px,55vw);min-height:300px;position:relative;overflow:hidden;background:linear-gradient(#363d70 0 70%,#4a4661 70%);touch-action:manipulation;cursor:crosshair}.stage:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 68px,#ffffff08 70px 72px);pointer-events:none}.stage:after{content:'';position:absolute;left:-10%;bottom:26%;width:120%;height:3px;background:#a9add044}.nameplate{position:absolute;left:50%;transform:translateX(-50%);top:18px;background:#101327ad;border:2px solid #ffffff47;padding:8px 22px;border-radius:12px;text-align:center;font-weight:950;font-size:clamp(16px,3vw,21px);white-space:nowrap}.nameplate span{font-size:11px;display:block;color:#c4c9e7;font-weight:600}.enemy{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:215px;height:300px;transform-origin:50% 85%;filter:drop-shadow(0 15px 10px #14142866);transition:filter .08s}.enemy.hit{animation:recoil .24s ease}.enemy.ko{animation:ko .65s ease forwards}.head{position:absolute;left:49px;top:15px;width:117px;height:123px;border:5px solid #20203a;background:#f6b887;border-radius:46% 46% 44% 44%;z-index:2}.hair{position:absolute;left:43px;top:1px;width:130px;height:62px;background:#27243a;border:5px solid #20203a;border-radius:70px 70px 25px 18px;z-index:3}.hair:after{content:'';position:absolute;right:0;top:39px;width:24px;height:55px;border-radius:12px;background:#27243a}.eye{position:absolute;top:66px;width:12px;height:14px;background:#232032;border-radius:50%}.eye.l{left:25px}.eye.r{right:25px}.mouth{position:absolute;left:45px;bottom:21px;width:20px;height:8px;border-bottom:4px solid #9c4f52;border-radius:50%}.body{position:absolute;left:32px;top:127px;width:152px;height:130px;background:#e6b850;border:5px solid #25233c;border-radius:47px 47px 20px 20px}.body:after{content:'♥';font-size:55px;color:#f15e7b;position:absolute;left:50%;top:23px;transform:translateX(-50%);text-shadow:2px 3px #2222}.arm{position:absolute;top:148px;width:45px;height:108px;border-radius:24px;background:#f4b785;border:5px solid #23223a}.arm.l{left:4px;transform:rotate(15deg)}.arm.r{right:4px;transform:rotate(-15deg)}.leg{position:absolute;top:248px;width:55px;height:55px;background:#2c304d;border:5px solid #22223a;border-radius:12px}.leg.l{left:45px}.leg.r{right:45px}.shadow{position:absolute;width:230px;height:26px;border-radius:50%;background:#11132766;bottom:4%;left:50%;transform:translateX(-50%)}.glove{position:absolute;width:115px;height:105px;border:6px solid #3a1422;border-radius:47% 46% 40% 42%;background:linear-gradient(135deg,#ff747d,#dc234d);box-shadow:inset -12px -12px #9d184044,0 8px 0 #4e1732;z-index:7;pointer-events:none;opacity:0;left:50%;top:57%;transform:translate(-50%,60%) scale(.5)}.glove.swing{animation:swing .25s ease-out}.effect{position:absolute;z-index:8;font-size:clamp(26px,6vw,55px);font-weight:1000;color:var(--y);text-shadow:4px 4px #ad265d,-2px -2px #221e38;pointer-events:none;animation:float .68s ease-out forwards;white-space:nowrap}.flash{position:absolute;inset:0;background:#ffffff28;pointer-events:none;opacity:0}.flash.on{animation:flash .18s}.controls{padding:15px 22px 22px;background:#1c1f35;text-align:center}.btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{cursor:pointer;touch-action:manipulation;font:900 17px system-ui,'Malgun Gothic',sans-serif;border:0;border-radius:12px;padding:14px 24px;transition:transform .08s}button:active{transform:translateY(3px) scale(.97)}.punch{background:var(--y);color:#27202b;box-shadow:0 5px #a57d25}.special{background:#ef4e73;color:white;box-shadow:0 5px #9b2245}.reset{background:#3e4265;color:#e5e7ff;box-shadow:0 5px #252744}.message{margin:15px 0 0;color:#c2c4d6;font-size:13px;min-height:20px}.finish{display:none;position:absolute;inset:0;z-index:12;background:#16172bd9;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}.finish.show{display:flex}.finish strong{font-size:clamp(30px,7vw,59px);color:var(--y);text-shadow:4px 5px #d94066}.finish p{font-size:18px;color:#e7e3fa}.finish button{background:var(--y);color:#252131}@keyframes recoil{0%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-44%) rotate(12deg) scale(.95)}100%{transform:translateX(-50%) rotate(0)}}@keyframes ko{to{transform:translate(-50%,55px) rotate(77deg);opacity:.85}}@keyframes swing{0%{opacity:0;transform:translate(-50%,75%) scale(.55)}40%{opacity:1;transform:translate(-50%,-7%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-35%) scale(1.25)}}@keyframes float{0%{opacity:1;transform:translate(-50%,0) rotate(-9deg) scale(.8)}100%{opacity:0;transform:translate(-50%,-90px) rotate(10deg) scale(1.35)}}@keyframes flash{30%{opacity:1}100%{opacity:0}}@media(max-width:600px){.stage{height:380px}.top{padding:14px}.health{margin:0 14px 12px}.stats{gap:9px}.stat{min-width:65px}.stat b{font-size:19px}.controls{padding:14px}.btns button{padding:12px 14px;font-size:14px}}

/* 말풍선과 누적 멍 효과 */
.taunt{position:absolute;z-index:5;left:calc(50% + 73px);top:65px;min-width:172px;padding:12px 14px;border-radius:17px;background:#fff;color:#241e3a;border:3px solid #29243f;box-shadow:4px 5px 0 #1413296b;font-size:17px;font-weight:1000;text-align:center;transform:rotate(5deg);pointer-events:none;animation:bob 1.6s ease-in-out infinite alternate}.taunt:after{content:'';position:absolute;left:22px;bottom:-17px;width:20px;height:20px;background:#fff;border-right:3px solid #29243f;border-bottom:3px solid #29243f;transform:rotate(45deg)}
.bruise{position:absolute;z-index:4;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s,transform .2s;background:radial-gradient(ellipse at 53% 48%,#4d294e 3%,#693c80 36%,#8d5c9e 60%,#b67d9444 82%,transparent 100%);mix-blend-mode:multiply;transform:rotate(-18deg) scale(.7)}
.bruise.b1{width:41px;height:31px;top:68px;left:5px}.bruise.b2{width:38px;height:30px;top:70px;right:5px;transform:rotate(16deg) scale(.7)}.bruise.b3{width:31px;height:24px;top:53px;left:18px}.bruise.b4{width:32px;height:26px;top:53px;right:17px}.bruise.b5{width:32px;height:25px;top:86px;left:40px}.bruise.b6{width:27px;height:19px;top:87px;right:29px}
.head[data-hits="0"] .bruise{opacity:0!important}.head .bruise.active{opacity:var(--bruise-opacity,.65);transform:rotate(-12deg) scale(1)}.head .bruise.b2.active{transform:rotate(16deg) scale(1)}
.taunt.apologizing{background:#fff3d6;border-color:#a84b60;color:#602a43;animation:apologyPop .35s ease-out, bob 1.6s ease-in-out .35s infinite alternate}.taunt.apologizing:after{background:#fff3d6;border-color:#a84b60}@keyframes apologyPop{from{transform:scale(.65) rotate(-9deg);opacity:.4}to{transform:scale(1) rotate(5deg);opacity:1}}@keyframes bob{to{transform:rotate(2deg) translateY(-6px)}}
@media(max-width:600px){.taunt{left:calc(50% + 40px);top:77px;min-width:145px;font-size:13px;padding:9px 10px}.taunt:after{left:14px}}

/* 모바일 터치 최적화 */
html{-webkit-text-size-adjust:100%}body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}.stage,.btns button{touch-action:manipulation}.stage{isolation:isolate}.btns button{min-height:54px}.btns button:focus-visible{outline:3px solid white;outline-offset:3px}
@media(max-width:600px){
 body{display:block;padding:0;background:#1d1f37;min-height:100dvh}
 .shell{border:0;border-radius:0;width:100%;min-height:100dvh;display:flex;flex-direction:column;box-shadow:none}
 .top{gap:8px;padding:12px 14px 9px}.top>div:first-child{width:100%}.title{font-size:23px}.tag{font-size:10px;padding:3px 8px}.stats{width:100%;justify-content:space-around;gap:4px}.stat{min-width:0;flex:1}.stat small{font-size:10px}.stat b{font-size:20px}
 .health{height:16px;margin:0 14px 9px}
 .stage{height:clamp(330px,52dvh,510px);min-height:330px;flex:1;max-height:540px;cursor:pointer}
 .enemy{bottom:5%;transform:translateX(-50%) scale(.86);transform-origin:bottom center}
 .taunt{left:auto;right:10px;top:67px;min-width:0;max-width:min(44vw,185px);font-size:clamp(12px,3.3vw,16px);overflow-wrap:anywhere;line-height:1.35;padding:9px 10px;z-index:9}
 .taunt:after{left:15px}
 .nameplate{top:12px;padding:6px 15px;font-size:17px}
 .controls{padding:12px 12px max(16px,env(safe-area-inset-bottom));flex-shrink:0}
 .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .btns button{font-size:16px;padding:14px 8px;min-height:60px}
 .btns .punch{grid-column:1/-1;font-size:21px;min-height:68px}
 .message{margin:11px 0 0;font-size:12px;line-height:1.45}
}
@media(max-width:360px){.enemy{transform:translateX(-50%) scale(.76)}.taunt{right:5px;max-width:42vw;top:78px;font-size:12px}.title{font-size:20px}.btns button{font-size:13px}}
@media(orientation:landscape) and (max-height:500px){.stage{min-height:250px;height:270px;flex:none}.shell{min-height:0}.enemy{transform:translateX(-50%) scale(.72)}.taunt{top:50px}}
</style>
</head>
<body><div class="shell"><div class="top"><div><span class="tag">FICTIONAL BOSS BATTLE</span><div class="title">🥊 기부천사 펀치 아레나</div></div><div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>콤보</small><b id="combo">0</b></div><div class="stat"><small>남은 시간</small><b id="time">30</b></div></div></div><div class="health"><div id="hp"></div></div><div class="stage" id="stage" aria-label="펀치 게임 화면"><div class="nameplate">😇 기부천사 <span>가상의 코믹 게임 캐릭터</span></div><div class="taunt" id="taunt">이거 인증못하시죵?</div><div class="shadow"></div><div class="enemy" id="enemy"><div class="leg l"></div><div class="leg r"></div><div class="arm l"></div><div class="arm r"></div><div class="body"></div><div class="head" id="head" data-hits="0"><div class="bruise b1"></div><div class="bruise b2"></div><div class="bruise b3"></div><div class="bruise b4"></div><div class="bruise b5"></div><div class="bruise b6"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div><div class="hair"></div></div><div class="glove" id="glove"></div><div class="flash" id="flash"></div><div class="finish" id="finish"><strong id="endtitle">K.O.!</strong><p id="endtext"></p><button id="again">다시 도전 ↻</button></div></div><div class="controls"><div class="btns"><button class="punch" id="punch">👊 펀치 (스페이스)</button><button class="special" id="special">💥 필살기 (F) <span id="charge">0/5</span></button><button class="reset" id="reset">↻ 재시작</button></div><p class="message" id="msg">30초 동안 최대한 많은 점수를 획득해 봐! 화면을 터치해도 펀치가 나가.</p></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),stage=$('stage'),enemy=$('enemy'),glove=$('glove'),flash=$('flash');let score=0,combo=0,hp=100,time=30,charge=0,hits=0,running=false,ended=false,timer=null,last=0,apologyIndex=0,nextApologyAt=3;const apologies=['죄송합니다… 제가 말이 심했어요! 😭','제가 괜히 시비 걸었어요. 정말 죄송해요!','인증하라고 비꼰 거 사과드릴게요…','말투가 무례했어요. 다시는 안 그럴게요!','제 잘못입니다. 진심으로 사과합니다!','상대방 기분 생각 못 했어요. 미안해요…','조롱한 건 잘못했어요. 사과할게요!','앞으로는 예의 있게 대화하겠습니다…'];const words=['퍽!','팡!','억!','콰직!','이얍!','정신차려!','COMBO!'];function render(){ $('score').textContent=score.toLocaleString();$('combo').textContent=combo;$('time').textContent=time;$('hp').style.width=Math.max(0,hp)+'%';$('charge').textContent=charge+'/5'}function start(){if(running||ended)return;running=true;timer=setInterval(()=>{time--;render();if(time<=0)end(false)},1000)}function impact(power,special=false){if(ended)return;start();const now=Date.now();combo=now-last<1100?combo+1:1;last=now;const damage=special?34:Math.min(12,5+Math.floor(combo/5));hp=Math.max(0,hp-damage);hits+=special?3:1;while(hits>=nextApologyAt){const bubble=$('taunt');bubble.textContent=apologies[apologyIndex%apologies.length];bubble.classList.remove('apologizing');void bubble.offsetWidth;bubble.classList.add('apologizing');apologyIndex++;nextApologyAt+=(apologyIndex%2===1?4:3)}const head=$('head');head.dataset.hits=hits;head.querySelectorAll('.bruise').forEach((bruise,i)=>{bruise.classList.toggle('active',hits>i);bruise.style.setProperty('--bruise-opacity',String(Math.min(.94,.34+hits*.07)))});score+=damage*10+(combo>1?combo*3:0);charge=special?0:Math.min(5,charge+1);enemy.classList.remove('hit');void enemy.offsetWidth;enemy.classList.add('hit');glove.classList.remove('swing');void glove.offsetWidth;glove.classList.add('swing');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');let eff=document.createElement('div');eff.className='effect';eff.textContent=special?'💥 SUPER HIT!':(combo%5===0?combo+' COMBO!':words[Math.floor(Math.random()*5)]);eff.style.left=(44+Math.random()*12)+'%';eff.style.top=(32+Math.random()*18)+'%';stage.appendChild(eff);setTimeout(()=>eff.remove(),690);if(special)$('msg').textContent='🔥 필살기 적중!';else if(charge===5)$('msg').textContent='⚡ 필살기 충전 완료! F 키를 눌러!';else $('msg').textContent=combo>5?`🔥 ${combo}연속 콤보! 계속 가자!`:'좋아! 계속 공격!';render();if(hp<=0)end(true)}function end(ko){clearInterval(timer);running=false;ended=true;if(ko)enemy.classList.add('ko');$('endtitle').textContent=ko?'K.O.! 🏆':'TIME UP! ⏰';$('endtext').textContent=`최종 점수 ${score.toLocaleString()}점 · 최대한 속 시원하게!`;$('finish').classList.add('show')}function reset(){clearInterval(timer);score=0;combo=0;hp=100;time=30;charge=0;hits=0;apologyIndex=0;nextApologyAt=3;$('taunt').textContent='이거 인증못하시죵?';$('taunt').classList.remove('apologizing');$('head').dataset.hits='0';$('head').querySelectorAll('.bruise').forEach(b=>b.classList.remove('active'));running=false;ended=false;last=0;enemy.className='enemy';$('finish').classList.remove('show');$('msg').textContent='새로운 라운드! 화면을 터치하거나 스페이스바로 펀치!';render()}$('punch').onclick=()=>impact(1);$('special').onclick=()=>{if(charge===5)impact(1,true);else $('msg').textContent=`필살기는 펀치 ${5-charge}번 후 사용 가능!`};$('reset').onclick=reset;$('again').onclick=reset;stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(!e.target.closest('.finish'))impact(1)});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)impact(1)}else if(e.key.toLowerCase()==='f'&&!e.repeat){if(charge===5)impact(1,true)}});render()})();
</script></body></html>
